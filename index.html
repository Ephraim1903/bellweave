<script>
const L=g=>g<=5?1:g<=10?2:3,LN={1:'Primary (Grades 1–5)',2:'Middle & Secondary (6–10)',3:'Senior Secondary (11–12)'};
const DS={'HOD':4,'Senior Teacher':3,'Teacher':2,'Junior Teacher':1},DM={'HOD':24,'Senior Teacher':28,'Teacher':30,'Junior Teacher':30};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'],LET=i=>String.fromCharCode(65+i);
let S={days:5,per:8,lunch:4,secs:{},nid:1,T:[],tt:null,v:'home',fn:{},user:null,sel:'1-0',selT:0,
subs:{1:'English:6\nTamil:5\nMaths:6\nEVS:5\nSocial:2\nComputer:2\nArt:2\nPE:2\nMoral:2',2:'English:6\nTamil:5\nMaths:7\nScience:6\nSocial:5\nComputer:2\nPE:2\nArt:1',3:'English:6\nMaths:7\nPhysics:6\nChemistry:6\nBiology:6\nComputer Sci:5\nPE:1'}};
for(let g=1;g<=12;g++)S.secs[g]=6;
try{const x=localStorage.getItem('bellweave');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('bellweave',JSON.stringify(S))}catch(e){}};
const parse=l=>S.subs[l].split('\n').map(x=>x.split(':')).filter(x=>x[0].trim()).map(x=>({n:x[0].trim(),p:Math.max(1,+x[1]||1)}));
const sc=t=>DS[t.des]*100+t.exp;
const col=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 65% 82%)`};
const go=v=>{S.v=v;draw()};
const LOGO='<svg viewBox="0 0 48 48" width="40" height="40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lg)"/><path d="M24 8c-6 0-9 4.500-9 10v6l-3 5h24l-3-5v-6c0-5.500-3-10-9-10z" fill="#fff"/><circle cx="24" cy="38" r="3.200" fill="#fff"/><path d="M13 19c5 4 17 4 22 0M13 25c5 4 17 4 22 0" stroke="#16a34a" stroke-width="1.800" fill="none" stroke-linecap="round"/><path d="M19 12c3 3 7 3 10 0" stroke="#16a34a" stroke-width="1.500" fill="none" stroke-linecap="round"/></svg>';
const GH='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 00-3.800 23.400c.6.1.8-.3.8-.6v-2c-3.300.7-4-1.600-4-1.600-.5-1.400-1.300-1.800-1.300-1.800-1.100-.7.1-.7.1-.7 1.200.1 1.800 1.200 1.800 1.200 1.100 1.800 2.800 1.300 3.500 1 .1-.8.4-1.300.8-1.600-2.700-.3-5.500-1.300-5.500-5.900 0-1.300.5-2.400 1.200-3.200-.1-.3-.5-1.500.1-3.200 0 0 1-.3 3.300 1.200a11.500 11.500 0 016 0c2.300-1.500 3.300-1.200 3.300-1.200.7 1.700.2 2.900.1 3.200.8.8 1.200 1.900 1.200 3.200 0 4.600-2.800 5.600-5.500 5.900.4.400.8 1.100.8 2.200v3.300c0 .3.2.7.8.6A12 12 0 0012 .3"/></svg>';
const GG='<b style="font:700 17px Arial;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);-webkit-background-clip:text;color:transparent">G</b>';
const rg=t=>'BWT-'+String(t.id).padStart(4,'0'),cc_=(g,s)=>'G'+String(g).padStart(2,'0')+LET(s);
const FB=null; /* paste your Firebase web config here, e.g. {apiKey:"..",authDomain:"..",projectId:"..",appId:".."} to enable real Google/GitHub login */
let AM='in',CH='bar',CL=0;
const hx=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}};
const users=()=>{try{return JSON.parse(localStorage.getItem('bw_users')||'{}')}catch(e){return{}}},setUsers=u=>{try{localStorage.setItem('bw_users',JSON.stringify(u))}catch(e){}};
function authHTML(){const up=AM=='up';
 return`<div class="auth"><div class="ah"><span class="fl" style="left:8%;top:12%">🔔</span><span class="fl" style="left:70%;top:20%;animation-delay:2s">📅</span><span class="fl" style="left:20%;top:75%;animation-delay:4s">🎓</span><span class="fl" style="left:75%;top:70%;animation-delay:1s">📚</span>
 <div class="brand">${LOGO}<div><b style="font-size:26px">Bell<span>Weave</span></b><small>School Timetable ERP</small></div></div>
 <h1 style="font-size:30px;line-height:1.2">Weave every bell into the<br>perfect timetable.</h1><p>✔ Grades 1–12, all sections<br>✔ Teachers matched by subject, designation &amp; experience<br>✔ Clash-free in seconds, with workload charts</p></div>
 <div class="af"><div class="acd"><div class="tabs"><button class="${up?'':'on'}" onclick="am('in')">Log in</button><button class="${up?'on':''}" onclick="am('up')">Sign up</button></div>
 <h2>${up?'Create your account':'Welcome back'}</h2>
 ${up?'<label>Full name<input id="an" autocomplete="name"></label>':''}
 <label>Email<input id="ae" type="email" autocomplete="email" onkeydown="if(event.key==\'Enter\')doAuth()"></label>
 <label>Password<input id="ap" type="password" oninput="pw(this.value)" onkeydown="if(event.key==\'Enter\')doAuth()"></label>
 ${up?'<div class="pm"><div id="pmb" style="width:0"></div></div><label style="margin-top:10px">Confirm password<input id="ap2" type="password"></label>':''}
 <label class="row" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" onchange="ap.type=this.checked?\'text\':\'password\'" style="width:auto"> Show password</label>
 <div id="aerr"></div><button class="p sb" onclick="doAuth()">${up?'Create account':'Log in'}</button>
 <p style="text-align:center;color:var(--mu)">or continue with</p><div class="soc"><button onclick="social('Google')">${GG} Google</button><button onclick="social('GitHub')">${GH} GitHub</button></div>
 <p style="text-align:center;margin-bottom:0"><small>${up?'Already registered?':'New to BellWeave?'} <a href="#" onclick="am('${up?'in':'up'}');return false" style="color:var(--ac)">${up?'Log in':'Create an account'}</a></small></p></div></div></div>`}
const am=m=>{AM=m;draw()},aerr=m=>{const x=$e('aerr');x.textContent=m;x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake')};
function pw(v){const s=[v.length>=6,v.length>=10,/[A-Z]/.test(v)&&/[a-z]/.test(v),/\d/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length,b=$e('pmb');if(b){b.style.width=s*20+'%';b.style.background=['#dc2626','#dc2626','#f59e0b','#84cc16','#16a34a','#16a34a'][s]}}
async function doAuth(){const e=$e('ae').value.trim().toLowerCase(),p=$e('ap').value,U=users();if(!/^\S+@\S+\.\S+$/.test(e))return aerr('Enter a valid email address');
 if(AM=='up'){const n=$e('an').value.trim();if(!n)return aerr('Please enter your name');if(p.length<6)return aerr('Password must be at least 6 characters');if(p!=$e('ap2').value)return aerr('Passwords do not match');if(U[e])return aerr('Account already exists – please log in');U[e]={name:n,h:await hx(p)};setUsers(U);enter({name:n,email:e,via:'Email'})}
 else{if(!U[e]||U[e].h!=await hx(p))return aerr('Wrong email or password (or no account yet – sign up)');enter({name:U[e].name,email:e,via:'Email'})}}
const enter=u=>{S.user=u;S.v='home';draw();toast('Welcome, '+u.name+' 👋')},logout=()=>{S.user=null;AM='in';draw()};
const ld=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('Could not load Firebase'));document.head.appendChild(s)});
async function social(p){try{if(!FB){enter({name:p+' Demo User',email:p.toLowerCase()+'@demo.local',via:p+' (demo)'});toast(p+' login runs in demo mode until Firebase keys are added',0);return}
 if(!window.firebase||!firebase.auth){await ld('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await ld('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js')}
 if(!firebase.apps.length)firebase.initializeApp(FB);const pr=p=='Google'?new firebase.auth.GoogleAuthProvider():new firebase.auth.GithubAuthProvider(),r=(await firebase.auth().signInWithPopup(pr)).user;enter({name:r.displayName||r.email,email:r.email||'',via:p})}catch(e){aerr(e.message)}}
function gsearch(q){q=q.trim().toLowerCase();const r=$e('gr');if(!q){r.style.display='none';return}const o=[];
 S.T.forEach(t=>{if([rg(t),t.name,t.des,'level '+t.level,...t.subs].join(' ').toLowerCase().includes(q))o.push(['👩‍🏫',rg(t)+' · '+t.name,t.subs.join(', ')+' · '+t.des,`pickT(${t.id})`])});
 for(let g=1;g<=12;g++)for(let s=0;s<S.secs[g];s++)if(`grade ${g}${LET(s)} class ${g}${LET(s)} section ${LET(s)} ${cc_(g,s)} level ${L(g)}`.toLowerCase().includes(q))o.push(['🏫','Grade '+g+LET(s),cc_(g,s),`pickC('${g}-${s}')`]);
 r.innerHTML=o.slice(0,14).map(x=>`<div class="sr" onclick="${x[3]};$e('gr').style.display='none'"><span>${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')||'<div class="sr">No matches</div>';r.style.display='block'}
function pickT(id){if(!S.tt){S.v='teach';draw();return toast('Generate the timetable to view this teacher’s schedule')}S.selT=id;S.v='tt';draw();$e('tc').scrollIntoView({behavior:'smooth'})}
function pickC(k){if(!S.tt){S.v='tt';draw();return toast('Generate the timetable first')}S.sel=k;S.v='tt';draw();$e('cc').scrollIntoView({behavior:'smooth'})}

function repair(gr,u,busy,D,P){if(!u.t)return false;const K=(t,d,p)=>t+'|'+d+'|'+p;
 for(let d=0;d<D;d++)for(let p=0;p<P;p++){const x=gr[d][p];if(!x||busy.has(K(u.t,d,p)))continue;
  for(let d2=0;d2<D;d2++)for(let p2=0;p2<P;p2++){if(gr[d2][p2]||(x.t&&busy.has(K(x.t,d2,p2))))continue;
   if(x.t){busy.delete(K(x.t,d,p));busy.add(K(x.t,d2,p2))}
   gr[d2][p2]=x;gr[d][p]={sub:u.sub,t:u.t};busy.add(K(u.t,d,p));return true}}return false}
async function generate(){
 if(BUSY)return;const w=check();if(w.length&&!confirm('Capacity warnings:\n'+w.slice(0,3).join('\n')+'\n\nGenerate anyway?'))return;
 BUSY=1;const t0=Date.now();
 try{
  const D=S.days,P=S.per,asg={},load={},miss=[];S.T.forEach(t=>load[t.id]=0);
  ov(1,'Step 1 of 3 · Assigning teachers',4,'Matching level, subject, designation & experience');await sleep(600);
  const secs=[];for(let g=12;g>=1;g--)for(let s=0;s<S.secs[g];s++)secs.push({g,s,k:g+'-'+s,l:L(g)});
  if(!secs.length)throw new Error('No sections set – import or enter sections first');
  const ranked=[...S.T].sort((a,b)=>sc(b)-sc(a));
  for(const c of secs)for(const sb of parse(c.l)){const t=ranked.find(t=>t.level==c.l&&load[t.id]+sb.p<=t.max&&t.subs.some(x=>x.toLowerCase()==sb.n.toLowerCase()));
   if(t)load[t.id]+=sb.p;else miss.push(`Grade ${c.g}${LET(c.s)} – ${sb.n}: no level ${c.l} teacher available`);(asg[c.k]=asg[c.k]||[]).push({sub:sb.n,t:t?t.id:null,p:sb.p})}
  let best=null;const N=60;
  for(let at=0;at<N&&(!best||best.bad);at++){
   const order=[...secs];if(at)order.sort(()=>Math.random()-.5);const busy=new Set(),grid={};let bad=0;
   for(let i=0;i<order.length;i++){const c=order[i],gr=Array.from({length:D},()=>Array(P).fill(null)),cnt={};
    for(const u of [...asg[c.k]].sort((a,b)=>b.p-a.p))for(let k=0;k<u.p;k++){let bs=1e9,bp=null;
     for(let d=0;d<D;d++)for(let p=0;p<P;p++){if(gr[d][p]||(u.t&&busy.has(u.t+'|'+d+'|'+p)))continue;
      const x=(cnt[u.sub+d]||0)*100+(gr[d][p-1]&&gr[d][p-1].sub==u.sub?60:0)+(p>=P-2&&u.p>3?15:0)+Math.random()*(at?30:5)+p*(u.p>4?1:0);if(x<bs){bs=x;bp=[d,p]}}
     if(!bp){if(!repair(gr,u,busy,D,P))bad++;continue}const[d,p]=bp;gr[d][p]={sub:u.sub,t:u.t};cnt[u.sub+d]=(cnt[u.sub+d]||0)+1;if(u.t)busy.add(u.t+'|'+d+'|'+p)}
    gr.forEach(r=>r.forEach((x,j)=>{if(!x)r[j]={sub:'Activity',t:null}}));grid[c.k]=gr;
    if(i%10==0){ov(1,'Step 2 of 3 · Building clash-free timetable',8+Math.round(84*(at+i/order.length)/N),`Attempt ${at+1} of up to ${N} · class ${i+1}/${order.length}`+(best?` · best so far: ${best.bad} unplaced`:''));await sleep()}}
   if(!best||bad<best.bad)best={grid,bad}}
  ov(1,'Step 3 of 3 · Finishing up',97,'Preparing your timetable views');await sleep(500);
  S.tt={grid:best.grid,load,miss,bad:best.bad,secs:secs.map(c=>c.k),ms:Date.now()-t0};S.v='tt';if(!(S.sel in best.grid))S.sel='1-0';
  ov(0);draw();const w2=best.bad||miss.length;toast(w2?'Generated with warnings – see details':'✔ Timetable generated – no clashes',w2)
 }catch(e){ov(0);toast('Error: '+e.message,1);console.error(e)}finally{BUSY=0}}

 <div class="row" style="margin-top:10px"><button class="p" onclick="generate()">⚡ Generate timetable</button>${S.tt?'<button onclick="print()">🖨 Print</button><button onclick="csv()">⬇ CSV</button>':''}</div></div>`;
 if(!S.tt)return h;const T=S.tt;
 h+=`<div class="chips"><span class="chip">🏫 ${T.secs.length} classes</span><span class="chip">👩‍🏫 ${S.T.filter(t=>T.load[t.id]).length} teachers used</span><span class="chip">⏱ ${((T.ms||0)/1000).toFixed(1)}s</span></div><div class="card">${T.bad||T.miss.length?`<div class="w">⚠ ${T.bad} period(s) could not be placed. ${T.miss.length} subject(s) have no teacher.</div>${T.miss.slice(0,8).map(x=>`<div class="w">${x}</div>`).join('')}`:'<div class="ok">✔ Conflict-free timetable: no teacher double-booked, no level mixing.</div>'}</div>`;
 h+=`<div class="card" id="cc"><h2>Class timetable</h2><label class="noprint">Class<select onchange="S.sel=this.value;draw()">${T.secs.map(k=>{const[g,s]=k.split('-');return`<option value="${k}" ${S.sel==k?'selected':''}>Grade ${g}${LET(+s)} (${cc_(g,+s)})</option>`}).join('')}</select></label><h3>Grade ${S.sel.split('-')[0]}${LET(+S.sel.split('-')[1])}</h3>
 ${table((d,p)=>{const x=T.grid[S.sel][d][p];return`<td class="td" title="Click to open this teacher's timetable" onclick="viewT(${x.t||0})" style="background:${col(x.sub)}"><b>${x.sub}</b><i>${x.t?tn_(x.t):''}</i></td>`})}</div>`;
 const t0=S.T.find(t=>t.id==S.selT)||S.T[0];
 if(t0){const gr={};for(const k of T.secs)T.grid[k].forEach((r,d)=>r.forEach((x,p)=>{if(x.t==t0.id)gr[d+'|'+p]=k}));
 h+=`<div class="card" id="tc"><h2>Teacher timetable</h2><label class="noprint">Teacher<select onchange="S.selT=+this.value;draw()">${S.T.map(t=>`<option value="${t.id}" ${t.id==t0.id?'selected':''}>${rg(t)} · ${t.name}</option>`)}</select></label><h3>${rg(t0)} · ${t0.name} · ${t0.des} · ${t0.exp} yrs</h3>
 ${table((d,p)=>{const k=gr[d+'|'+p];if(!k)return'<td>—</td>';const[g,s]=k.split('-'),x=T.grid[k][d][p];return`<td class="td" title="Click to open this class" onclick="viewC('${k}')" style="background:${col(x.sub)}"><b>${g}${LET(+s)}</b><i>${x.sub}</i></td>`})}</div>`}
 h+=chartCard()+`<div class="card sc"><h2>Teacher workload</h2><table><tr><th>Reg No</th><th>Teacher</th><th>Designation</th><th>Exp</th><th>Periods</th><th>Load</th></tr>${[...S.T].sort((a,b)=>a.level-b.level||sc(b)-sc(a)).map(t=>`<tr><td><b>${rg(t)}</b></td><td class="l">${t.name}</td><td>${t.des}</td><td>${t.exp}</td><td>${T.load[t.id]||0}/${t.max}</td><td><div class="bar"><div style="width:${Math.min(100,100*(T.load[t.id]||0)/t.max)}%"></div></div></td></tr>`).join('')}</table></div>`;return h}
function csv(){const T=S.tt;let o='Class,Day,Period,Subject,Teacher\n';for(const k of T.secs){const[g,s]=k.split('-');T.grid[k].forEach((r,d)=>r.forEach((x,p)=>o+=`${g}${LET(+s)},${DAYS[d]},${p+1},${x.sub},"${x.t?tn_(x.t):''}"\n`))}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/csv'}));a.download='bellweave-timetable.csv';a.click()}
draw();
</script></body></html>
