function authHTML(){const up=AM=='up';
 return`<div class="auth"><div class="ah"><span class="fl" style="left:8%;top:12%">🔔</span><span class="fl" style="left:70%;top:20%;animation-delay:2s">📅</span><span class="fl" style="left:20%;top:75%;animation-delay:4s">🎓</span><span class="fl" style="left:75%;top:70%;animation-delay:1s">📚</span>

async function doAuth(){const e=$e('ae').value.trim().toLowerCase(),p=$e('ap').value,U=users();if(!/^\S+@\S+\.\S+$/.test(e))return aerr('Enter a valid email address');

  gr[d][p]=null;const rr=can(u,d,p,1,gr,ctx,cnt,R,RM,D);gr[d][p]=x;if(!rr)continue;

 return false}

const EVC={Holiday:'#fca5a5',Event:'#86efac',Exam:'#fcd34d',PTM:'#93c5fd'};
const blocked=iso=>{const e=(S.cal||[]).find(e=>e.blk&&e.from<=iso&&iso<=e.to);return e?e.title:''};
const evOn=iso=>(S.cal||[]).filter(e=>e.from<=iso&&iso<=e.to);
const houses=()=>(S.houses||'Red,Blue').split(',').map(x=>x.trim()).filter(Boolean);
const ties=(a,b)=>a<b?-1:a>b?1:0;
function setupX(){const r=S.rules;return`<div class="card"><h2>Timetable rules</h2><div class="row"><label>Max periods / day per teacher<input type="number" min="3" max="10" value="${r.tmax}" style="width:110px" onchange="S.rules.tmax=+this.value"></label><label>Morning subjects (before lunch)<input value="${r.am}" onchange="S.rules.am=this.value"></label><label>No back-to-back (same subject)<input value="${r.b2b}" onchange="S.rules.b2b=this.value"></label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" ${r.opd?'checked':''} onchange="S.rules.opd=this.checked" style="width:auto"> No subject twice a day</label></div><small>Double periods / labs: in the subject boxes above write <b>Subject:periods:D</b>, e.g. <b>Computer:2:D</b> (2-period blocks).</small></div>
 <div class="g3"><div class="card"><h2>Rooms &amp; labs</h2><small>One line per room group → <b>Name: subjects : how many rooms</b></small><textarea onchange="S.rooms=this.value">${S.rooms}</textarea></div><div class="card"><h2>Fixed slots (locked)</h2><small>One line → <b>Name: scope, day, period</b>. Scope = all, a grade (7) or a class (7B). Day = all or Mon…Sat. If Name is a subject, its teacher is used.</small><textarea onchange="S.fx=this.value">${S.fx}</textarea></div></div>`}
function dashX(){const t=today(),b=blocked(t),an=[...S.ann].sort((x,y)=>(y.pin?1:0)-(x.pin?1:0)||ties(y.date,x.date)).slice(0,3),up=(S.cal||[]).filter(e=>e.to>=t).sort((x,y)=>ties(x.from,y.from)).slice(0,5);
 return(b?`<div class="card" style="border-color:#dc2626">🏖 Today is blocked: <b>${b}</b></div>`:'')+(an.length||up.length?`<div class="g3">${an.length?`<div class="card hv" onclick="go('note')"><h2>📢 Announcements</h2>${an.map(a=>`<div class="ann ${a.pri=='Important'?'imp':''}" style="padding:4px 8px;margin-bottom:6px"><b>${a.pin?'📌 ':''}${a.title}</b><br><small>${a.date} · ${a.by}</small></div>`).join('')}</div>`:''}${up.length?`<div class="card hv" onclick="go('cal')"><h2>📅 Upcoming</h2>${up.map(e=>`<div style="margin-bottom:5px"><span class="tag" style="background:${EVC[e.type]};color:#111">${e.type}</span> ${e.title} <small>${e.from}${e.to!=e.from?' → '+e.to:''}</small></div>`).join('')}</div>`:''}</div>`:'')}
/* calendar */
function addEv(){const ti=$e('evt').value.trim(),f=$e('evf').value,to=$e('evo').value||f;if(!ti||!f)return toast('Enter a title and a date',1);if(to<f)return toast('End date is before start date',1);
 S.cal.push({id:Date.now(),title:ti,type:$e('evy').value,from:f,to,blk:$e('evb').checked});draw();toast('Added to calendar')}
function vCal(){const m=S.cm||today().slice(0,7),[Y,M]=m.split('-').map(Number),first=new Date(Y,M-1,1),n=new Date(Y,M,0).getDate(),off=(first.getDay()+6)%7,t=today();
 const nm=d=>fmt(new Date(Y,M-1+d,1)).slice(0,7);let cells='';for(let i=0;i<Math.ceil((off+n)/7)*7;i++){const dn=i-off+1;if(i%7==0)cells+='<tr>';if(dn<1||dn>n)cells+='<td></td>';else{const iso=m+'-'+String(dn).padStart(2,'0'),es=evOn(iso);cells+=`<td class="${i%7>4?'we':''} ${iso==t?'today':''}" onclick="$e('evf').value='${iso}'"><b>${dn}</b>${es.map(e=>`<span class="ev" style="background:${EVC[e.type]}">${e.title}</span>`).join('')}</td>`}if(i%7==6)cells+='</tr>'}
 return`<div class="card"><div class="row" style="align-items:center"><button onclick="S.cm='${nm(-1)}';draw()">◀</button><h2 style="margin:0;min-width:170px;text-align:center">${first.toLocaleString('en',{month:'long'})} ${Y}</h2><button onclick="S.cm='${nm(1)}';draw()">▶</button><button onclick="S.cm='${t.slice(0,7)}';draw()">Today</button></div><div class="sc"><table class="cal"><tr>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<th>${d}</th>`).join('')}</tr>${cells}</table></div></div>
 <div class="card noprint"><h2>Add holiday / event</h2><div class="row"><label>Title<input id="evt"></label><label>Type<select id="evy" onchange="$e('evb').checked=this.value=='Holiday'||this.value=='Exam'">${Object.keys(EVC).map(k=>`<option>${k}</option>`).join('')}</select></label><label>From<input id="evf" type="date"></label><label>To (optional)<input id="evo" type="date"></label><label style="flex-direction:row;align-items:center;gap:6px"><input id="evb" type="checkbox" checked style="width:auto"> Block classes &amp; exams</label><button class="p" onclick="addEv()">Add</button></div><small>Blocked dates are skipped by the exam planner and marked in attendance.</small></div>
 <div class="card sc"><h2>All entries (${S.cal.length})</h2><table><tr><th>Type</th><th>Title</th><th>Dates</th><th>Blocks</th><th></th></tr>${[...S.cal].sort((a,b)=>ties(a.from,b.from)).map(e=>`<tr><td><span class="tag" style="background:${EVC[e.type]};color:#111">${e.type}</span></td><td class="l">${e.title}</td><td>${e.from}${e.to!=e.from?' → '+e.to:''}</td><td>${e.blk?'Yes':'No'}</td><td><button onclick="S.cal=S.cal.filter(x=>x.id!=${e.id});draw()">✕</button></td></tr>`).join('')||'<tr><td colspan=5>Nothing yet</td></tr>'}</table></div>`}
/* announcements */
function addAnn(){const t=$e('ant').value.trim();if(!t)return toast('Enter a title',1);S.ann.unshift({id:Date.now(),title:t,body:$e('anb').value.trim(),pri:$e('anp').value,date:today(),by:S.user?S.user.name:'Admin',pin:false});draw();toast('Announcement posted')}
function vNotes(){return`<div class="card noprint"><h2>📢 New announcement to staff</h2><div class="row"><label>Title<input id="ant" style="width:240px"></label><label>Priority<select id="anp"><option>Normal</option><option>Important</option></select></label></div><label style="margin-top:8px">Message<textarea id="anb" style="min-height:70px"></textarea></label><div style="margin-top:8px"><button class="p" onclick="addAnn()">Post</button></div><small>Notices are stored on this device until a shared database is added.</small></div>
 ${[...S.ann].sort((x,y)=>(y.pin?1:0)-(x.pin?1:0)||ties(y.date,x.date)).map(a=>`<div class="card ann ${a.pri=='Important'?'imp':''}"><div class="row" style="justify-content:space-between"><b>${a.pin?'📌 ':''}${a.pri=='Important'?'❗ ':''}${a.title}</b><span class="noprint"><button onclick="S.ann.find(x=>x.id==${a.id}).pin=!${a.pin};draw()">${a.pin?'Unpin':'📌 Pin'}</button> <button onclick="S.ann=S.ann.filter(x=>x.id!=${a.id});draw()">✕</button></span></div><p style="white-space:pre-wrap">${a.body||''}</p><small>${a.date} · ${a.by}</small></div>`).join('')||'<div class="card">No announcements yet.</div>'}`}
/* attendance */
function mark(id,st){const d=S.ad||today(),a=S.att.t[d]=S.att.t[d]||{};if(a[id]==st)delete a[id];else a[id]=st;draw()}
function mkRos(){const k=S.ak||'1-0',n=+$e('rn').value;if(!(n>0))return;S.ros[k]=Array.from({length:n},(_,i)=>cc_(...k.split('-').map(Number))+'-'+String(i+1).padStart(2,'0'));S.hs[k]=[];draw()}
function setRos(){const k=S.ak||'1-0',a=$e('rt').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!a.length)return;S.ros[k]=a;S.hs[k]=[];draw()}
function absS(i){const d=S.ad||today(),k=S.ak||'1-0',m=S.att.s[d]=S.att.s[d]||{},a=m[k]=m[k]||[],n=S.ros[k][i],j=a.indexOf(n);if(j<0)a.push(n);else a.splice(j,1);draw()}
function attT(d){const a=S.att.t[d]||{},A=Object.values(a).filter(v=>v=='A').length,Lv=Object.values(a).filter(v=>v=='L').length;
 return`<div class="card"><div class="chips"><span class="chip">✅ Present ${S.T.length-A-Lv}</span><span class="chip">❌ Absent ${A}</span><span class="chip">🌴 Leave ${Lv}</span></div><div class="sc" style="max-height:460px;overflow:auto"><table><tr><th>Reg No</th><th>Name</th><th>Subjects</th><th>Status</th></tr>${S.T.map(t=>`<tr><td><b>${rg(t)}</b></td><td class="l">${t.name}</td><td class="l">${t.subs.join(', ')}</td><td><button class="${a[t.id]?'':'p'}" onclick="${a[t.id]?`mark(${t.id},'${a[t.id]}')`:''}">P</button> <button class="${a[t.id]=='A'?'p':''}" onclick="mark(${t.id},'A')">A</button> <button class="${a[t.id]=='L'?'p':''}" onclick="mark(${t.id},'L')">L</button></td></tr>`).join('')||'<tr><td colspan=4>Add teachers first</td></tr>'}</table></div><small>P = present, A = absent, L = on leave. Absent / leave teachers are skipped for invigilation duty on that date.</small></div>`}
function attS(d){const k=S.ak||'1-0',ros=S.ros[k]||[],ab=((S.att.s[d]||{})[k])||[];
 return`<div class="card"><div class="row"><label>Class<select onchange="S.ak=this.value;draw()">${Object.keys(S.secs).flatMap(g=>[...Array(+S.secs[g]||0)].map((_,s)=>`<option value="${g}-${s}" ${k==g+'-'+s?'selected':''}>Grade ${g}${LET(s)}</option>`)).join('')}</select></label></div>
 ${ros.length?`<div class="chips" style="margin-top:10px"><span class="chip">👥 ${ros.length} students</span><span class="chip">✅ Present ${ros.length-ab.length}</span><span class="chip">❌ Absent ${ab.length}</span></div><div class="sc" style="max-height:420px;overflow:auto"><table><tr><th>#</th><th>Student</th><th>Absent</th></tr>${ros.map((n,i)=>`<tr><td>${i+1}</td><td class="l">${n}</td><td><input type="checkbox" ${ab.includes(n)?'checked':''} onchange="absS(${i})"></td></tr>`).join('')}</table></div>`:`<p>No students in this class yet. Create a roster:</p><div class="row"><label>Number of students<input id="rn" type="number" min="1" value="40" style="width:110px"></label><button class="p" onclick="mkRos()">Create numbered roster</button></div><label style="margin-top:8px">…or paste names (one per line)<textarea id="rt" style="min-height:90px"></textarea></label><button onclick="setRos()">Use these names</button>`}</div>`}
function vAtt(){const d=S.ad||today(),b=blocked(d),tab=S.at||'t';return`<div class="card"><div class="row"><label>Date<input type="date" value="${d}" onchange="S.ad=this.value;draw()"></label><button class="${tab=='t'?'p':''}" onclick="S.at='t';draw()">👩‍🏫 Teachers</button><button class="${tab=='s'?'p':''}" onclick="S.at='s';draw()">🎓 Students</button></div>${b?`<div class="w">🏖 ${b} – classes are blocked on this date.</div>`:''}</div>`+(tab=='t'?attT(d):attS(d))}
/* classes: class teacher + houses */
function autoCT(){const used=new Set;S.ct={};for(const k of Object.keys(S.secs).flatMap(g=>[...Array(+S.secs[g]||0)].map((_,s)=>g+'-'+s)).reverse()){const l=L(+k.split('-')[0]),cn=t=>S.tt&&S.tt.grid[k]?S.tt.grid[k].flat().filter(x=>x.t==t.id).length:0;const pool=S.T.filter(t=>t.level==l&&!used.has(t.id)).sort((a,b)=>cn(b)-cn(a)||sc(b)-sc(a));if(pool[0]){S.ct[k]=pool[0].id;used.add(pool[0].id)}}draw();toast('Class teachers assigned (same level only)')}
function autoHouse(){let c=0;const H=houses().length,n=+S.spc||40;if(!H)return toast('Add at least one house',1);Object.keys(S.secs).forEach(g=>{for(let s=0;s<(+S.secs[g]||0);s++){const k=g+'-'+s;if(!(S.ros[k]||[]).length)S.ros[k]=Array.from({length:n},(_,i)=>cc_(+g,s)+'-'+String(i+1).padStart(2,'0'))}});for(const k in S.ros)S.hs[k]=S.ros[k].map(()=>c++%H);draw();toast('Houses assigned evenly to '+c+' students')}
function vClasses(){const gf=+S.gf||0,H=houses(),ks=Object.keys(S.secs).flatMap(g=>[...Array(+S.secs[g]||0)].map((_,s)=>g+'-'+s)),tot=H.map(()=>0);Object.values(S.hs).forEach(a=>a.forEach(i=>tot[i]++));
 const rows=ks.filter(k=>!gf||k.split('-')[0]==gf).map(k=>{const[g,s]=k.split('-').map(Number),el=S.T.filter(t=>t.level==L(g)),hc=H.map(()=>0);(S.hs[k]||[]).forEach(i=>hc[i]++);const dup=S.ct[k]&&Object.keys(S.ct).filter(q=>S.ct[q]==S.ct[k]).length>1;
  return`<tr><td><b>${cc_(g,s)}</b> · Grade ${g}${LET(s)}</td><td><select onchange="S.ct['${k}']=+this.value;draw()"><option value="0">—</option>${el.map(t=>`<option value="${t.id}" ${S.ct[k]==t.id?'selected':''}>${rg(t)} · ${t.name}</option>`).join('')}</select>${dup?' ⚠ also class teacher elsewhere':''}</td><td>${(S.ros[k]||[]).length}</td><td>${H.map((h,i)=>`${h}: <b>${hc[i]}</b>`).join(' · ')}</td></tr>`}).join('');
 return`<div class="card"><div class="row"><label>Show grade<select onchange="S.gf=+this.value;draw()"><option value="0">All</option>${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${gf==i+1?'selected':''}>Grade ${i+1}</option>`).join('')}</select></label><label>Houses (comma separated)<input value="${S.houses}" onchange="S.houses=this.value;draw()"></label><label>Students per class (for new rosters)<input type="number" min="1" max="80" value="${S.spc||40}" style="width:120px" onchange="S.spc=+this.value"></label><button class="p" onclick="autoCT()">Auto-assign class teachers</button><button class="p" onclick="autoHouse()">Auto-assign houses</button></div><div class="chips" style="margin-top:10px">${H.map((h,i)=>`<span class="chip">🏠 ${h}: ${tot[i]} students</span>`).join('')}</div><small>Auto-assign houses makes a numbered roster for every class that has none (using the students-per-class number), then shares students evenly across houses. If you paste real names later in Attendance → Students, run Auto-assign houses again.</small></div><div class="card sc"><table><tr><th>Class</th><th>Class teacher</th><th>Students</th><th>Houses</th></tr>${rows||'<tr><td colspan=4>Set sections in Setup first</td></tr>'}</table></div>`}
/* exams */
function genExam(){const X=S.exs;if(!X.start)return toast('Choose the first exam date',1);const ex=lst(X.ex),sub=g=>parse(L(g)).filter(s=>!ex.includes(lc(s.n))),need=Math.max(...[1,6,11].map(g=>sub(g).length));let d=new Date(X.start+'T00:00'),n=0;const dates=[];
 while(dates.length<need&&n++<400){const wd=d.getDay(),iso=fmt(d);if(wd!=0&&!(wd==6&&S.days==5)&&!blocked(iso))dates.push(iso);d.setDate(d.getDate()+1)}
 const sched={},duty={},cnt={},short=[];for(let g=1;g<=12;g++){const s=sub(g);sched[g]=dates.map((_,i)=>s[i]?s[i].n:'')}
 dates.forEach((dt,i)=>{const used=new Set;for(let g=12;g>=1;g--){const sb=sched[g][i];if(!sb)continue;for(let s=0;s<(+S.secs[g]||0);s++)for(let q=0;q<(+X.inv||1);q++){const pen=t=>t.subs.some(z=>lc(z)==lc(sb))?1:0,pool=S.T.filter(t=>t.level==L(g)&&!used.has(t.id)&&!(S.att.t[dt]||{})[t.id]).sort((a,b)=>(cnt[a.id]||0)-(cnt[b.id]||0)||pen(a)-pen(b)||sc(a)-sc(b));const p=pool[0];if(!p){short.push(`${dt}: Grade ${g}${LET(s)} has no free invigilator`);continue}used.add(p.id);cnt[p.id]=(cnt[p.id]||0)+1;((duty[dt]=duty[dt]||{})[g+'-'+s]=(duty[dt][g+'-'+s]||[])).push(p.id)}}});
 S.exam={dates,sched,duty,cnt,short};S.ed=0;draw();toast(short.length?'Exam plan made with gaps':'✔ Exam timetable & invigilation duties ready',!!short.length)}
function vExam(){const X=S.exs,E=S.exam,wd=d=>new Date(d+'T00:00').toLocaleString('en',{weekday:'short',day:'numeric',month:'short'});
 let h=`<div class="card noprint"><h2>Exam planner</h2><div class="row"><label>First exam date<input type="date" value="${X.start}" onchange="S.exs.start=this.value"></label><label>Skip subjects (no written exam)<input value="${X.ex}" onchange="S.exs.ex=this.value"></label><label>Invigilators per class<select onchange="S.exs.inv=+this.value"><option ${X.inv==1?'selected':''}>1</option><option ${X.inv==2?'selected':''}>2</option></select></label><button class="p" onclick="genExam()">⚡ Generate exam timetable &amp; duties</button>${E?'<button onclick="print()">🖨 Print</button>':''}</div><small>One exam per grade per day. Weekends and blocked calendar dates are skipped. Invigilators come from the same section group, least-loaded first, and teachers marked absent/leave are skipped.</small></div>`;
 if(!E)return h;const di=Math.min(+S.ed||0,E.dates.length-1),dt=E.dates[di];
 h+=`<div class="card sc"><h2>Exam timetable</h2><table><tr><th>Grade</th>${E.dates.map(d=>`<th>${wd(d)}</th>`).join('')}</tr>${[...Array(12)].map((_,i)=>`<tr><th>${i+1}</th>${E.sched[i+1].map(s=>`<td ${s?`class="td" style="background:${col(s)}"`:''}>${s||'—'}</td>`).join('')}</tr>`).join('')}</table></div>`;
 h+=`<div class="card sc"><h2>Invigilation duty</h2><label class="noprint">Date<select onchange="S.ed=+this.value;draw()">${E.dates.map((d,i)=>`<option value="${i}" ${i==di?'selected':''}>${wd(d)}</option>`).join('')}</select></label><table><tr><th>Class</th><th>Subject</th><th>Invigilator(s)</th></tr>${Object.keys(E.duty[dt]||{}).map(k=>`<tr><td><b>${lbl(k)}</b></td><td>${E.sched[k.split('-')[0]][di]}</td><td class="l">${E.duty[dt][k].map(id=>rg(S.T.find(t=>t.id==id)||{id:0})+' · '+tn_(id)).join('<br>')}</td></tr>`).join('')}</table></div>`;
 h+=`<div class="card sc"><h2>Duty count per teacher</h2>${E.short.length?`<div class="w">⚠ ${E.short.slice(0,4).join(' · ')}</div>`:''}<table><tr><th>Reg No</th><th>Teacher</th><th>Duties</th></tr>${S.T.filter(t=>E.cnt[t.id]).sort((a,b)=>E.cnt[b.id]-E.cnt[a.id]).map(t=>`<tr><td><b>${rg(t)}</b></td><td class="l">${t.name}</td><td>${E.cnt[t.id]}</td></tr>`).join('')}</table></div>`;return h}
const VIEWS={home:()=>vHome(),setup:()=>vSetup(),teach:()=>vTeach(),tt:()=>vTT(),cls:()=>vClasses(),att:()=>vAtt(),exam:()=>vExam(),cal:()=>vCal(),note:()=>vNotes()};
function draw(){const lock=!S.user;document.body.classList.toggle('lock',lock);if(lock){$e('m').innerHTML=authHTML();save();return}
 $e('nav').innerHTML=[['home','🏠','Dashboard'],['setup','⚙️','1. Setup'],['teach','👩‍🏫','2. Teachers'],['tt','🗓️','3. Timetable'],['cls','🏫','Classes & Houses'],['att','✅','Attendance'],['exam','📝','Exams'],['cal','📅','Calendar'],['note','📢','Announcements']].map(([k,i,n])=>`<button class="${S.v==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('');
 $e('lgs').innerHTML=LOGO;$e('lgf').innerHTML=LOGO.replace('width="40" height="40"','width="22" height="22"');
 
 $e('um').innerHTML=`<div class="pf"><button class="pfb" onclick="event.stopPropagation();$e('pm').classList.toggle('show')"><span class="av">${S.user.name[0].toUpperCase()}</span><b>${S.user.name.split(' ')[0]}</b> ▾</button><div id="pm"><div class="pi"><span class="av">${S.user.name[0].toUpperCase()}</span><div><b>${S.user.name}</b><br><small>${S.user.email||''}</small><br><small>Signed in with ${S.user.via}</small></div></div><button class="p sb" onclick="logout()">⎋ Logout</button></div></div>`;
 $e('m').innerHTML=(VIEWS[S.v]||VIEWS.home)();save()}
initSets();

draw();
</script></body></html>
